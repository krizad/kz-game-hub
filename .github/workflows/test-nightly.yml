name: Nightly tests

# Test-only workflow (jest + Playwright e2e). Never gates PRs; run nightly or
# on demand. Uses a LOCAL MySQL service container — the repo .env points at
# the production database and must never be loaded here.
#
# The Playwright suites run as separate jobs, each with its own timeout: a
# single shared job previously hit the job-level timeout during the main
# suite and silently skipped the sim suite every night.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *' # 03:00 +07 daily

concurrency:
  group: nightly-tests
  cancel-in-progress: true

jobs:
  jest:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Local protocol URL only — NEVER the repo .env (production MySQL).
      # Jest specs mock @repo/database, so no real connection is made.
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/kz_game_hub_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - name: Install dependencies
        # --ignore-scripts like deploy.yml: unrs-resolver's postinstall
        # (`napi-postinstall`) fails on a fresh CI install. Everything this
        # workflow needs (prisma generate) runs as an explicit build step.
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build packages (build order matters)
        run: pnpm build --filter=@repo/types --filter=@repo/database

      - name: Jest (API)
        run: pnpm -F api test

  e2e-main:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kz_game_hub_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      # Local service DB only — NEVER the repo .env (production MySQL).
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/kz_game_hub_test
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/kz_game_hub_test
      ADMIN_SECRET: e2e-dummy-secret
      # No DISABLE_GAME_SETTINGS_DB here: it is injected per-server by both
      # playwright configs' webServer commands. Setting it job-wide also hits
      # jest, where game-settings.service.spec expects the DB path to load.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build packages (build order matters)
        run: pnpm build --filter=@repo/types --filter=@repo/database

      - name: Push schema and seed reference data (local DB)
        run: |
          pnpm db:push
          pnpm db:seed
          pnpm -F api exec node scripts/seed-e2e-artist.mjs

      - name: Playwright browsers
        run: pnpm -F web exec playwright install --with-deps chromium

      # playwright.config.ts ignores e2e/demo.spec.ts (recorded explicitly via
      # `playwright test demo`) and e2e/sim/ (own config below). The configs
      # spawn API (3101) + web (3100) themselves with DISABLE_GAME_SETTINGS_DB=1
      # and DISABLE_RATE_LIMIT=1. SoundCloud/YouTube sim entries stay skipped
      # (external, network-flaky) — E2E_SIM_INCLUDE_EXTERNAL is not set.
      - name: E2E main suite (no demos, no sims)
        run: pnpm -F web exec playwright test --reporter=list

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-main
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7

  e2e-sim:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: kz_game_hub_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: mysql://root:root@127.0.0.1:3306/kz_game_hub_test
      TEST_DATABASE_URL: mysql://root:root@127.0.0.1:3306/kz_game_hub_test
      ADMIN_SECRET: e2e-dummy-secret

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: pnpm/action-setup@v4
        with:
          version: 9.1.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build packages (build order matters)
        run: pnpm build --filter=@repo/types --filter=@repo/database

      - name: Push schema and seed reference data (local DB)
        run: |
          pnpm db:push
          pnpm db:seed
          pnpm -F api exec node scripts/seed-e2e-artist.mjs

      - name: Playwright browsers
        run: pnpm -F web exec playwright install --with-deps chromium

      - name: E2E sim suite (all default matrix entries)
        run: E2E_SIM_PLAYS=1 pnpm -F web exec playwright test -c playwright.sim.config.ts --reporter=list

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-sim
          path: |
            apps/web/test-results/
            apps/web/playwright-report/
          retention-days: 7
