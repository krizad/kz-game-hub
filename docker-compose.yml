services:
  mysql:
    image: mysql:8.0
    container_name: kz-game-hub-db
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: kz_game_hub
    # Host port 3307: 3306 is commonly occupied by other projects' DB
    # containers on dev machines — point DATABASE_URL at 3307 to use this.
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ppassword"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
